[project]
name = "semantic-qa"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
]

[project.optional-dependencies]
api = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.2.4",
    "qdrant-client==1.12.1",
    "sentence-transformers==3.3.1",
    "transformers==4.47.1",
    "torch==2.5.1",
]
bot = [
    "aiogram==3.15.0",
    "httpx==0.27.2",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "bot*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "sentence_transformers.*", "aiogram.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running PostgreSQL and Qdrant"]
