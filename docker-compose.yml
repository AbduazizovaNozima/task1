x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://qa:qa@postgres:5432/qa
    QDRANT_URL: http://qdrant:6333

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "log_checkpoints=off"]
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa
    ports: ["127.0.0.1:${POSTGRES_PORT:-5440}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    environment:
      QDRANT__LOG_LEVEL: WARN
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    volumes: [qdrant_storage:/qdrant/storage]

  ingest:
    <<: *app-env
    build: .
    image: ${QA_IMAGE:-semantic-qa}
    command: ["python", "-m", "app.cli", "ingest", "data/qa.xlsx"]
    volumes: [hf_cache:/models]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}

  api:
    <<: *app-env
    image: ${QA_IMAGE:-semantic-qa}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: [hf_cache:/models]
    depends_on:
      ingest: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 120s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    restart: on-failure:3
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres_data:
  qdrant_storage:
  hf_cache:
    external: true
    name: ${HF_CACHE_VOLUME:-task1_semantic_qa_hf_cache}
